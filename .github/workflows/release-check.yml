name: VNM release QA

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1,3,5'

permissions:
  contents: read

concurrency:
  group: vnm-release-qa-${{ github.event_name }}-${{ github.ref }}
  # Keep master verification and scheduled regressions; replace superseded PR checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-check:
    name: 'release:check'
    if: github.repository == 'Florin-Solent/VisioNovaMundi'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use verified Node 22 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Set canonical origin for the target guard
        run: git remote set-url origin https://github.com/Florin-Solent/VisioNovaMundi.git
      - name: Verify repository and production target
        run: node scripts/check-target.mjs
      - name: Classify release QA mode
        id: classify
        run: node scripts/release-mode.mjs --ci --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Validate documentation-only diff
        if: steps.classify.outputs.mode == 'DOCS'
        env:
          VNM_CHANGED_FILES: ${{ steps.classify.outputs.docs_files }}
        run: node scripts/release-mode.mjs --validate-docs
      - name: Install locked project dependencies
        if: steps.classify.outputs.mode != 'DOCS'
        run: npm ci
      - name: Provision pinned external browser tooling
        if: steps.classify.outputs.mode != 'DOCS'
        run: npm exec --yes --package=playwright@1.64.0-alpha-1790635538000 -- playwright install --with-deps chromium
      - name: Build and run selected browser QA suite
        if: steps.classify.outputs.mode != 'DOCS'
        env:
          VNM_QA_MODE: ${{ steps.classify.outputs.mode }}
          VNM_CHANGED_ROUTES: ${{ steps.classify.outputs.changed_routes }}
        run: npm run release:check
      - name: Preserve QA report
        if: always() && steps.classify.outputs.mode != 'DOCS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vnm-release-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/release-qa/local.json
          if-no-files-found: warn
          retention-days: 14
